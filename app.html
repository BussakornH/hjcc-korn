<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENTINEL · Joint Operations Center</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="description" content="SENTINEL, the Joint Operations Center, for the Historical Joint Crisis Committee (HJCC): forces, order of battle, battle overview, combat calculator and editable rules.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="charts.css">
<link rel="stylesheet" href="dnd.css">
<link rel="stylesheet" href="sentinel.css">
<script src="auth.js"></script>
<script src="app-gate.js"></script>
<script src="boot.js"></script>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Main menu">
    <div class="brand">
      <img class="lg-l" src="brand/lockup-light.svg" alt="Sentinel"><img class="lg-d" src="brand/lockup-dark.svg" alt="" aria-hidden="true">
    </div>
    <div>
      <div class="eyebrow side-lbl">Committee topic</div>
      <div class="topics" id="topics"></div>
      <a class="chg-topic" id="chgTopic" href="topics.html" hidden>Change topic</a>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="top-l">
        <button class="icon-btn menu-btn" data-a="menu" aria-label="Open menu"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <span class="top-logo"><img class="lg-l" src="brand/lockup-light.svg" alt="Sentinel"><img class="lg-d" src="brand/lockup-dark.svg" alt="" aria-hidden="true"></span>
      </div>
      <div class="crumbs"><h1 id="pageTitle">Overview</h1><div id="pageSub"></div></div>
      <div class="top-actions">
        <span class="save-state" id="saveState" role="status"></span>
        <button class="btn" data-a="undo" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo" aria-keyshortcuts="Control+Z"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span class="hide-sm">Undo</span></button>
        <button class="btn primary" data-a="addUnits" title="Add units" aria-label="Add units"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="hide-sm">Add units</span></button>
        <button class="btn" id="signOut" title="Sign out" aria-label="Sign out" data-a="signOut"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4"/><path d="M16 8l4 4-4 4M20 12H9"/></svg><span class="hide-sm">Sign out</span></button>
        <div class="daynight" id="dayNight" role="group" aria-label="Day or night mode">
          <button data-a="theme" data-v="light" id="dayBtn" title="Day mode"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Day</span></button>
          <button data-a="theme" data-v="dark" id="nightBtn" title="Night mode"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span>Night</span></button>
        </div>
      </div>
    </header>
    <main class="page" id="page"></main>
    <footer class="foot-note" id="footNote">SENTINEL Joint Operations Center &middot; Historical Joint Crisis Committee simulation. The chairs run every force and decide every outcome. Your forces are kept in this browser.</footer>
  </div>
</div>
<div class="drawer" id="drawer"></div>
<div class="modal-wrap" id="modal"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="impFile" accept=".json,application/json" hidden data-c="imp">
<script src="presets.js"></script>
<script src="charts.js"></script>
<script src="dnd.js"></script>
<script src="cities.js"></script>
<script src="terrain.js"></script>
<script src="map.js"></script>
<script src="troops-merge.js"></script>
<script src="troops.js"></script>
<script src="app.js"></script>
</body>
</html>
